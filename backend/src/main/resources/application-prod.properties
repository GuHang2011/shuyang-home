# Launch with --spring.profiles.active=prod. Private values come from the service environment.
shuyang.production=true
server.address=127.0.0.1
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false
spring.jmx.enabled=false
# A successful commit must be durable even if the process stops immediately.
spring.datasource.hikari.connection-init-sql=SET WRITE_DELAY 0
