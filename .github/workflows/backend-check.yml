name: Backend regression
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify backend and production guards
        working-directory: backend
        run: bash mvnw --batch-mode --no-transfer-progress clean verify
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify packaged startup, persistence and restore
        run: python scripts/test-production-runtime.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/target/surefire-reports/*.xml
